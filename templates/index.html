<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Studio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="dark">

  <!-- ── Sidebar ───────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="app-logo">PX</div>

    <div class="sidebar-section">
      <div class="sidebar-label">Module</div>
      <div id="module-dock">
        <div class="dock-chip" data-module-id="canvas"    draggable="true">🖼 Canvas</div>
        <div class="dock-chip" data-module-id="tools"     draggable="true">🔧 Werkzeuge</div>
        <div class="dock-chip" data-module-id="palette"   draggable="true">🎨 Palette</div>
        <div class="dock-chip" data-module-id="frames"    draggable="true">🎬 Frames</div>
        <div class="dock-chip" data-module-id="animation" draggable="true">▶ Animation</div>
        <div class="dock-chip" data-module-id="projects"  draggable="true">📁 Projekt</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Theme</div>
      <div class="theme-row">
        <button class="theme-dot active" data-theme="dark"  title="Dark"></button>
        <button class="theme-dot"        data-theme="oled"  title="OLED"></button>
        <button class="theme-dot"        data-theme="nord"  title="Nord"></button>
        <button class="theme-dot"        data-theme="retro" title="Retro"></button>
      </div>
      <div class="accent-row">
        <span style="font-size:11px;color:var(--text-muted)">Akzent</span>
        <input type="color" id="accent-color" value="#5DCAA5" title="Akzentfarbe">
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="sidebar-action" id="btn-save"       title="Speichern (Strg+S)">💾 Speichern</button>
      <button class="sidebar-action" id="btn-export-png" title="Aktuellen Frame als PNG">↓ PNG</button>
      <button class="sidebar-action" id="btn-export-gif" title="Alle Frames als animiertes GIF">↓ GIF</button>
    </div>
  </aside>

  <!-- ── Workspace ─────────────────────────────────────────────── -->
  <div class="workspace">
    <div class="zone-row">
      <div class="zone" id="zone-left"   data-zone="left">
        <div class="zone-hint">Modul hierher ziehen</div>
      </div>
      <div class="zone zone-center" id="zone-center" data-zone="center">
        <div class="zone-hint">Modul hierher ziehen</div>
      </div>
      <div class="zone" id="zone-right"  data-zone="right">
        <div class="zone-hint">Modul hierher ziehen</div>
      </div>
    </div>
    <div class="zone zone-bottom" id="zone-bottom" data-zone="bottom">
      <div class="zone-hint">Modul hierher ziehen (untere Leiste)</div>
    </div>
  </div>

  <!-- ── Module Pool (nicht platzierte Module leben hier) ──────── -->
  <div id="module-pool" style="display:none">

    <div class="module" id="mod-canvas" data-module-id="canvas">
      <div class="module-header">
        <span class="drag-handle" title="Verschieben">⠿</span>
        <span class="module-title">🖼 Canvas</span>
        <button class="module-close" title="Entfernen">✕</button>
      </div>
      <div class="module-body mod-canvas-body">
        <canvas id="main-canvas"></canvas>
      </div>
    </div>

    <div class="module" id="mod-tools" data-module-id="tools">
      <div class="module-header">
        <span class="drag-handle">⠿</span>
        <span class="module-title">🔧 Werkzeuge</span>
        <button class="module-close">✕</button>
      </div>
      <div class="module-body">
        <div class="tools-grid">
          <button class="tool-btn active" id="tool-draw"  title="Stift [B]">✏</button>
          <button class="tool-btn"        id="tool-fill"  title="Füllen [F]">⬡</button>
          <button class="tool-btn"        id="tool-erase" title="Radierer [E]">◻</button>
          <button class="tool-btn"        id="tool-pick"  title="Pipette [I]">✦</button>
        </div>
        <div class="color-row">
          <div id="color-swatch" class="color-swatch"></div>
          <input type="color" id="custom-color" value="#5DCAA5" title="Eigene Farbe">
          <span id="color-hex" class="color-hex">#5DCAA5</span>
        </div>
      </div>
    </div>

    <div class="module" id="mod-palette" data-module-id="palette">
      <div class="module-header">
        <span class="drag-handle">⠿</span>
        <span class="module-title">🎨 Palette</span>
        <button class="module-close">✕</button>
      </div>
      <div class="module-body">
        <div class="palette" id="palette"></div>
      </div>
    </div>

    <div class="module" id="mod-frames" data-module-id="frames">
      <div class="module-header">
        <span class="drag-handle">⠿</span>
        <span class="module-title">🎬 Frames</span>
        <div class="module-header-btns">
          <button class="icon-btn" id="btn-frame-add"  title="Hinzufügen">+</button>
          <button class="icon-btn" id="btn-frame-dupe" title="Duplizieren">⊕</button>
          <button class="icon-btn" id="btn-frame-del"  title="Löschen">✕</button>
        </div>
        <button class="module-close">✕</button>
      </div>
      <div class="module-body">
        <div class="frames-list" id="frames-list"></div>
      </div>
    </div>

    <div class="module" id="mod-animation" data-module-id="animation">
      <div class="module-header">
        <span class="drag-handle">⠿</span>
        <span class="module-title">▶ Animation</span>
        <button class="module-close">✕</button>
      </div>
      <div class="module-body">
        <label class="field-row">FPS <input type="number" id="fps-input" value="4" min="1" max="60"></label>
        <button id="btn-preview" class="btn btn-accent" style="width:100%;margin-top:8px">▶ Vorschau</button>
      </div>
    </div>

    <div class="module" id="mod-projects" data-module-id="projects">
      <div class="module-header">
        <span class="drag-handle">⠿</span>
        <span class="module-title">📁 Projekt</span>
        <button class="module-close">✕</button>
      </div>
      <div class="module-body project-body">
        <input type="text" id="project-name" placeholder="Projektname" maxlength="48" autocomplete="off">
        <select id="grid-size">
          <option value="8">8 × 8</option>
          <option value="12">12 × 12</option>
          <option value="16" selected>16 × 16</option>
          <option value="20">20 × 20</option>
          <option value="24">24 × 24</option>
          <option value="32">32 × 32</option>
          <option value="48">48 × 48</option>
          <option value="64">64 × 64</option>
        </select>
        <button id="btn-new"      class="btn" style="width:100%">+ Neues Projekt</button>
        <button id="btn-projects" class="btn" style="width:100%">📁 Alle Projekte</button>
      </div>
    </div>

  </div><!-- /module-pool -->

  <!-- ── Modals ─────────────────────────────────────────────────── -->
  <div id="modal-projects" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Projekte</h2>
        <button id="modal-projects-close" class="modal-close">✕</button>
      </div>
      <div id="projects-list"></div>
    </div>
  </div>

  <div id="modal-preview" class="modal hidden">
    <div class="modal-box modal-preview-box">
      <div class="modal-header">
        <h2>Vorschau</h2>
        <button id="modal-preview-close" class="modal-close">✕</button>
      </div>
      <canvas id="preview-canvas" style="display:block;margin:0 auto;image-rendering:pixelated;"></canvas>
      <div id="preview-info" style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-muted)"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
